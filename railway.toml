[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# KasmVNC serves on port 6901 — give it time to fully start
[[deploy.healthchecks]]
port = 6901
path = "/"
initialDelaySeconds = 30
timeoutSeconds = 10
periodSeconds = 15
